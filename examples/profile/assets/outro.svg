<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="900" height="130" role="img" aria-label="Clawd, the Claude Code mascot">
<style>:root{--ground:#d0d7de;--text:#1f2328;--muted:#656d76;--bubble:#ffffff;--bubble-stroke:#d0d7de;--decor:#3d3929;--background:none;}@media (prefers-color-scheme: dark){:root{--ground:#30363d;--text:#e6edf3;--muted:#8b949e;--bubble:#161b22;--bubble-stroke:#30363d;--decor:#8b949e;--background:none;}}
text{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}
.cl-bg{fill:var(--background)}
.cl-ground{stroke:var(--ground)}
.cl-bub{fill:var(--bubble);stroke:var(--bubble-stroke)}
.cl-bubfill{fill:var(--bubble)}
.cl-txt{fill:var(--text)}
.cl-muted-fill{fill:var(--muted)}
.cl-decor-fill{fill:var(--decor)}

@keyframes cl-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes cl-look{0%{transform:translateX(0)}20%{transform:translateX(-.5px)}40%{transform:translateX(0)}60%{transform:translateX(.5px)}80%{transform:translateX(0)}}
@keyframes cl-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--hop))}}
@keyframes cl-squash{0%,100%{transform:scale(1.08,.9)}25%{transform:scale(1,1)}50%{transform:scale(.96,1.05)}}
@keyframes cl-bounce{0%,66%,76%,86%,100%{transform:translateY(0)}71%,81%{transform:translateY(var(--hop))}}
@keyframes cl-bsquash{0%,64%,90%,100%{transform:scale(1,1)}66%,76%,86%{transform:scale(1.12,.86)}71%,81%{transform:scale(.94,1.06)}}
@keyframes cl-legs{0%{transform:translateY(0)}50%{transform:translateY(-.6px)}}
@keyframes cl-wave{0%,24%,100%{transform:translateY(0)}4%,12%,20%{transform:translateY(-2px)}8%,16%{transform:translateY(-1px)}}
@keyframes cl-sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes cl-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.95)}}
@keyframes cl-z{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(12px,-26px)}}
@keyframes cl-shadow{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(.7);opacity:.15}}
@keyframes cl-spin{to{transform:rotate(360deg)}}
@keyframes cl-pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes cl-drift{0%,100%{transform:translateX(0)}50%{transform:translateX(28px)}}
@keyframes cl-twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes cl-steam{0%{opacity:0;transform:translateY(0)}30%{opacity:.8}100%{opacity:0;transform:translateY(-1.6px)}}
@keyframes cl-flowersway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes cl-cycle-2{0%{opacity:0}2%{opacity:1}48%{opacity:1}50%{opacity:0}100%{opacity:0}}@keyframes cl-type-2{0%{transform:scaleX(0)}22.5%{transform:scaleX(1)}100%{transform:scaleX(1)}}</style>
<defs><pattern id="cl-dither" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="1.5" height="1.5" class="cl-decor-fill"/></pattern></defs>
<line class="cl-ground" x1="3" y1="115.5" x2="897" y2="115.5" stroke-width="3" stroke-linecap="round" stroke-dasharray="0 7.8"/>
<g transform="translate(242.5 74)"><ellipse cx="27.5" cy="41.5" rx="24.75" ry="3" fill="#000" opacity=".3"/><g style="animation:cl-breathe 3s ease-in-out 0s infinite;transform-box:fill-box;transform-origin:50% 100%;"><g transform="scale(5)"><g fill="#D97757" shape-rendering="crispEdges"><rect x="1" y="7" width="1" height="1"/><rect x="3" y="7" width="1" height="1"/><rect x="7" y="7" width="1" height="1"/><rect x="9" y="7" width="1" height="1"/><rect x="1" y="1" width="9" height="6"/><rect x="0" y="3" width="1" height="2"/><rect x="10" y="3" width="1" height="2"/><rect x="1.75" y="3.5" width="1.5" height="0.45" fill="#141413"/><rect x="7.75" y="3.5" width="1.5" height="0.45" fill="#141413"/></g></g></g><text class="cl-muted-fill" x="46.75" y="-2" font-size="12" font-weight="700" style="opacity:0;animation:cl-z 3s ease-out 0s infinite">z</text><text class="cl-muted-fill" x="46.75" y="-2" font-size="14" font-weight="700" style="opacity:0;animation:cl-z 3s ease-out 1s infinite">z</text><text class="cl-muted-fill" x="46.75" y="-2" font-size="16" font-weight="700" style="opacity:0;animation:cl-z 3s ease-out 2s infinite">z</text></g>
<g transform="translate(417 66)"><ellipse cx="33" cy="49.5" rx="29.7" ry="3.6" fill="#000" opacity=".3"/><g><g transform="scale(6)"><g fill="#D97757" shape-rendering="crispEdges"><rect x="1" y="6" width="1" height="2"/><rect x="3" y="6" width="1" height="2"/><rect x="7" y="6" width="1" height="2"/><rect x="9" y="6" width="1" height="2"/><rect x="1" y="0" width="9" height="6"/><rect x="0" y="2" width="1" height="2"/><g style="animation:cl-wave 3s steps(1) 0s infinite;"><rect x="10" y="2" width="1" height="2"/></g><g style="animation:cl-look 7s steps(1) 0s infinite;"><rect x="1.6" y="2.5" width="0.6" height="0.6" fill="#141413"/><rect x="2.2" y="1.9" width="0.6" height="0.6" fill="#141413"/><rect x="2.8" y="2.5" width="0.6" height="0.6" fill="#141413"/><rect x="7.6" y="2.5" width="0.6" height="0.6" fill="#141413"/><rect x="8.2" y="1.9" width="0.6" height="0.6" fill="#141413"/><rect x="8.8" y="2.5" width="0.6" height="0.6" fill="#141413"/></g></g></g></g><g style="opacity:0;animation:cl-cycle-2 7s linear 0s infinite"><g><rect class="cl-bub" x="46.2" y="-42" width="190" height="30" rx="8" stroke-width="2"/><path class="cl-bub" d="M56.2 -13 L50.2 -2 L68.2 -13 Z" stroke-width="2" stroke-linejoin="round"/><rect class="cl-bubfill" x="57.2" y="-15" width="10" height="4"/><text class="cl-txt" x="141.2" y="-21.96" text-anchor="middle" font-size="14" font-weight="700">thanks for visiting!</text></g></g><g style="opacity:0;animation:cl-cycle-2 7s linear 3.5s infinite"><g><rect class="cl-bub" x="46.2" y="-42" width="131.2" height="30" rx="8" stroke-width="2"/><path class="cl-bub" d="M56.2 -13 L50.2 -2 L68.2 -13 Z" stroke-width="2" stroke-linejoin="round"/><rect class="cl-bubfill" x="57.2" y="-15" width="10" height="4"/><text class="cl-txt" x="111.8" y="-21.96" text-anchor="middle" font-size="14" font-weight="700">see you soon!</text></g></g></g>
<g transform="translate(602.5 74)"><ellipse cx="27.5" cy="41.5" rx="24.75" ry="3" fill="#000" opacity=".3"/><g><g transform="scale(5)"><g fill="#D97757" shape-rendering="crispEdges"><rect x="1" y="7" width="1" height="1"/><rect x="3" y="7" width="1" height="1"/><rect x="7" y="7" width="1" height="1"/><rect x="9" y="7" width="1" height="1"/><rect x="1" y="1" width="9" height="6"/><rect x="0" y="3" width="1" height="2"/><rect x="10" y="3" width="1" height="2"/><g style="animation:cl-look 7s steps(1) 1.2s infinite;"><g style="animation:cl-blink 3.5s linear 1.2s infinite;transform-box:fill-box;transform-origin:50% 50%;"><rect x="2" y="3" width="1" height="1" fill="#141413"/><rect x="8" y="3" width="1" height="1" fill="#141413"/></g></g><rect x="1.35" y="2.35" width="2.3" height="2.3" fill="none" stroke="#5c1a33" stroke-width=".45"/><rect x="7.35" y="2.35" width="2.3" height="2.3" fill="none" stroke="#5c1a33" stroke-width=".45"/><rect x="3.6" y="3.1" width="3.8" height="0.45" fill="#5c1a33"/><rect x="8.2" y="4" width="2.6" height="3.2" fill="#3f3a80"/><rect x="8.2" y="4" width="0.5" height="3.2" fill="#e8e1d4"/></g></g></g></g>
</svg>
