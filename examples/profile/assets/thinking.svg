<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 80" width="900" height="80" role="img" aria-label="Clawd, the Claude Code mascot">
<style>:root{--ground:#d0d7de;--text:#1f2328;--muted:#656d76;--bubble:#ffffff;--bubble-stroke:#d0d7de;--decor:#3d3929;--background:none;}@media (prefers-color-scheme: dark){:root{--ground:#30363d;--text:#e6edf3;--muted:#8b949e;--bubble:#161b22;--bubble-stroke:#30363d;--decor:#8b949e;--background:none;}}
text{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}
.cl-bg{fill:var(--background)}
.cl-ground{stroke:var(--ground)}
.cl-bub{fill:var(--bubble);stroke:var(--bubble-stroke)}
.cl-bubfill{fill:var(--bubble)}
.cl-txt{fill:var(--text)}
.cl-muted-fill{fill:var(--muted)}
.cl-decor-fill{fill:var(--decor)}

@keyframes cl-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes cl-look{0%{transform:translateX(0)}20%{transform:translateX(-.5px)}40%{transform:translateX(0)}60%{transform:translateX(.5px)}80%{transform:translateX(0)}}
@keyframes cl-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--hop))}}
@keyframes cl-squash{0%,100%{transform:scale(1.08,.9)}25%{transform:scale(1,1)}50%{transform:scale(.96,1.05)}}
@keyframes cl-bounce{0%,66%,76%,86%,100%{transform:translateY(0)}71%,81%{transform:translateY(var(--hop))}}
@keyframes cl-bsquash{0%,64%,90%,100%{transform:scale(1,1)}66%,76%,86%{transform:scale(1.12,.86)}71%,81%{transform:scale(.94,1.06)}}
@keyframes cl-legs{0%{transform:translateY(0)}50%{transform:translateY(-.6px)}}
@keyframes cl-wave{0%,24%,100%{transform:translateY(0)}4%,12%,20%{transform:translateY(-2px)}8%,16%{transform:translateY(-1px)}}
@keyframes cl-sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes cl-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.95)}}
@keyframes cl-z{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(12px,-26px)}}
@keyframes cl-shadow{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(.7);opacity:.15}}
@keyframes cl-spin{to{transform:rotate(360deg)}}
@keyframes cl-pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes cl-drift{0%,100%{transform:translateX(0)}50%{transform:translateX(28px)}}
@keyframes cl-twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes cl-steam{0%{opacity:0;transform:translateY(0)}30%{opacity:.8}100%{opacity:0;transform:translateY(-1.6px)}}
@keyframes cl-flowersway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes cl-cycle-16{0%{opacity:0}0.63%{opacity:1}5.63%{opacity:1}6.25%{opacity:0}100%{opacity:0}}@keyframes cl-type-16{0%{transform:scaleX(0)}2.81%{transform:scaleX(1)}100%{transform:scaleX(1)}}</style>
<defs><pattern id="cl-dither" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="1.5" height="1.5" class="cl-decor-fill"/></pattern><clipPath id="cl-clip-0"><rect x="127" y="27.5" width="208.65" height="22.5" style="animation:cl-type-16 40s steps(19) 0s infinite;transform-box:fill-box;transform-origin:0 50%"/></clipPath><clipPath id="cl-clip-1"><rect x="127" y="27.5" width="125.85" height="22.5" style="animation:cl-type-16 40s steps(11) 2.5s infinite;transform-box:fill-box;transform-origin:0 50%"/></clipPath><clipPath id="cl-clip-2"><rect x="127" y="27.5" width="136.2" height="22.5" style="animation:cl-type-16 40s steps(12) 5s infinite;transform-box:fill-box;transform-origin:0 50%"/></clipPath><clipPath id="cl-clip-3"><rect x="127" y="27.5" width="125.85" height="22.5" style="animation:cl-type-16 40s steps(11) 7.5s infinite;transform-box:fill-box;transform-origin:0 50%"/></clipPath><clipPath id="cl-clip-4"><rect x="127" y="27.5" width="156.9" height="22.5" style="animation:cl-type-16 40s steps(14) 10s infinite;transform-box:fill-box;transform-origin:0 50%"/></clipPath><clipPath id="cl-clip-5"><rect x="127" y="27.5" width="115.5" height="22.5" style="animation:cl-type-16 40s steps(10) 12.5s infinite;transform-box:fill-box;transform-origin:0 50%"/></clipPath><clipPath id="cl-clip-6"><rect x="127" y="27.5" width="105.15" height="22.5" style="animation:cl-type-16 40s steps(9) 15s infinite;transform-box:fill-box;transform-origin:0 50%"/></clipPath><clipPath id="cl-clip-7"><rect x="127" y="27.5" width="125.85" height="22.5" style="animation:cl-type-16 40s steps(11) 17.5s infinite;transform-box:fill-box;transform-origin:0 50%"/></clipPath><clipPath id="cl-clip-8"><rect x="127" y="27.5" width="115.5" height="22.5" style="animation:cl-type-16 40s steps(10) 20s infinite;transform-box:fill-box;transform-origin:0 50%"/></clipPath><clipPath id="cl-clip-9"><rect x="127" y="27.5" width="105.15" height="22.5" style="animation:cl-type-16 40s steps(9) 22.5s infinite;transform-box:fill-box;transform-origin:0 50%"/></clipPath><clipPath id="cl-clip-10"><rect x="127" y="27.5" width="105.15" height="22.5" style="animation:cl-type-16 40s steps(9) 25s infinite;transform-box:fill-box;transform-origin:0 50%"/></clipPath><clipPath id="cl-clip-11"><rect x="127" y="27.5" width="105.15" height="22.5" style="animation:cl-type-16 40s steps(9) 27.5s infinite;transform-box:fill-box;transform-origin:0 50%"/></clipPath><clipPath id="cl-clip-12"><rect x="127" y="27.5" width="94.8" height="22.5" style="animation:cl-type-16 40s steps(8) 30s infinite;transform-box:fill-box;transform-origin:0 50%"/></clipPath><clipPath id="cl-clip-13"><rect x="127" y="27.5" width="115.5" height="22.5" style="animation:cl-type-16 40s steps(10) 32.5s infinite;transform-box:fill-box;transform-origin:0 50%"/></clipPath><clipPath id="cl-clip-14"><rect x="127" y="27.5" width="105.15" height="22.5" style="animation:cl-type-16 40s steps(9) 35s infinite;transform-box:fill-box;transform-origin:0 50%"/></clipPath><clipPath id="cl-clip-15"><rect x="127" y="27.5" width="146.55" height="22.5" style="animation:cl-type-16 40s steps(13) 37.5s infinite;transform-box:fill-box;transform-origin:0 50%"/></clipPath></defs>
<g transform="translate(116.75 39.05)"><g style="animation:cl-spin 2.4s linear infinite,cl-pulse 1.2s ease-in-out infinite" stroke="#D97757" stroke-width="2.14" stroke-linecap="round"><line x1="0" y1="-6.3" x2="0" y2="6.3"/><line x1="-6.3" y1="0" x2="6.3" y2="0"/><line x1="-4.45" y1="-4.45" x2="4.45" y2="4.45"/><line x1="-4.45" y1="4.45" x2="4.45" y2="-4.45"/></g></g><g style="opacity:0;animation:cl-cycle-16 40s linear 0s infinite"><g clip-path="url(#cl-clip-0)"><text x="131" y="44" text-anchor="start" font-size="15" font-weight="700" fill="#D97757">Flibbertigibbeting…</text></g><text class="cl-muted-fill" x="311" y="44" font-size="12.75">(esc to interrupt)</text></g><g style="opacity:0;animation:cl-cycle-16 40s linear 2.5s infinite"><g clip-path="url(#cl-clip-1)"><text x="131" y="44" text-anchor="start" font-size="15" font-weight="700" fill="#D97757">Cogitating…</text></g><text class="cl-muted-fill" x="239" y="44" font-size="12.75">(esc to interrupt)</text></g><g style="opacity:0;animation:cl-cycle-16 40s linear 5s infinite"><g clip-path="url(#cl-clip-2)"><text x="131" y="44" text-anchor="start" font-size="15" font-weight="700" fill="#D97757">Percolating…</text></g><text class="cl-muted-fill" x="248" y="44" font-size="12.75">(esc to interrupt)</text></g><g style="opacity:0;animation:cl-cycle-16 40s linear 7.5s infinite"><g clip-path="url(#cl-clip-3)"><text x="131" y="44" text-anchor="start" font-size="15" font-weight="700" fill="#D97757">Marinating…</text></g><text class="cl-muted-fill" x="239" y="44" font-size="12.75">(esc to interrupt)</text></g><g style="opacity:0;animation:cl-cycle-16 40s linear 10s infinite"><g clip-path="url(#cl-clip-4)"><text x="131" y="44" text-anchor="start" font-size="15" font-weight="700" fill="#D97757">Contemplating…</text></g><text class="cl-muted-fill" x="266" y="44" font-size="12.75">(esc to interrupt)</text></g><g style="opacity:0;animation:cl-cycle-16 40s linear 12.5s infinite"><g clip-path="url(#cl-clip-5)"><text x="131" y="44" text-anchor="start" font-size="15" font-weight="700" fill="#D97757">Mustering…</text></g><text class="cl-muted-fill" x="230" y="44" font-size="12.75">(esc to interrupt)</text></g><g style="opacity:0;animation:cl-cycle-16 40s linear 15s infinite"><g clip-path="url(#cl-clip-6)"><text x="131" y="44" text-anchor="start" font-size="15" font-weight="700" fill="#D97757">Moseying…</text></g><text class="cl-muted-fill" x="221" y="44" font-size="12.75">(esc to interrupt)</text></g><g style="opacity:0;animation:cl-cycle-16 40s linear 17.5s infinite"><g clip-path="url(#cl-clip-7)"><text x="131" y="44" text-anchor="start" font-size="15" font-weight="700" fill="#D97757">Spelunking…</text></g><text class="cl-muted-fill" x="239" y="44" font-size="12.75">(esc to interrupt)</text></g><g style="opacity:0;animation:cl-cycle-16 40s linear 20s infinite"><g clip-path="url(#cl-clip-8)"><text x="131" y="44" text-anchor="start" font-size="15" font-weight="700" fill="#D97757">Simmering…</text></g><text class="cl-muted-fill" x="230" y="44" font-size="12.75">(esc to interrupt)</text></g><g style="opacity:0;animation:cl-cycle-16 40s linear 22.5s infinite"><g clip-path="url(#cl-clip-9)"><text x="131" y="44" text-anchor="start" font-size="15" font-weight="700" fill="#D97757">Scheming…</text></g><text class="cl-muted-fill" x="221" y="44" font-size="12.75">(esc to interrupt)</text></g><g style="opacity:0;animation:cl-cycle-16 40s linear 25s infinite"><g clip-path="url(#cl-clip-10)"><text x="131" y="44" text-anchor="start" font-size="15" font-weight="700" fill="#D97757">Noodling…</text></g><text class="cl-muted-fill" x="221" y="44" font-size="12.75">(esc to interrupt)</text></g><g style="opacity:0;animation:cl-cycle-16 40s linear 27.5s infinite"><g clip-path="url(#cl-clip-11)"><text x="131" y="44" text-anchor="start" font-size="15" font-weight="700" fill="#D97757">Divining…</text></g><text class="cl-muted-fill" x="221" y="44" font-size="12.75">(esc to interrupt)</text></g><g style="opacity:0;animation:cl-cycle-16 40s linear 30s infinite"><g clip-path="url(#cl-clip-12)"><text x="131" y="44" text-anchor="start" font-size="15" font-weight="700" fill="#D97757">Honking…</text></g><text class="cl-muted-fill" x="212" y="44" font-size="12.75">(esc to interrupt)</text></g><g style="opacity:0;animation:cl-cycle-16 40s linear 32.5s infinite"><g clip-path="url(#cl-clip-13)"><text x="131" y="44" text-anchor="start" font-size="15" font-weight="700" fill="#D97757">Wizarding…</text></g><text class="cl-muted-fill" x="230" y="44" font-size="12.75">(esc to interrupt)</text></g><g style="opacity:0;animation:cl-cycle-16 40s linear 35s infinite"><g clip-path="url(#cl-clip-14)"><text x="131" y="44" text-anchor="start" font-size="15" font-weight="700" fill="#D97757">Clauding…</text></g><text class="cl-muted-fill" x="221" y="44" font-size="12.75">(esc to interrupt)</text></g><g style="opacity:0;animation:cl-cycle-16 40s linear 37.5s infinite"><g clip-path="url(#cl-clip-15)"><text x="131" y="44" text-anchor="start" font-size="15" font-weight="700" fill="#D97757">Deliberating…</text></g><text class="cl-muted-fill" x="257" y="44" font-size="12.75">(esc to interrupt)</text></g>
