<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 90" width="900" height="90" role="img" aria-label="Clawd, the Claude Code mascot">
<style>:root{--ground:#d0d7de;--text:#1f2328;--muted:#656d76;--bubble:#ffffff;--bubble-stroke:#d0d7de;--decor:#3d3929;--background:none;}@media (prefers-color-scheme: dark){:root{--ground:#30363d;--text:#e6edf3;--muted:#8b949e;--bubble:#161b22;--bubble-stroke:#30363d;--decor:#8b949e;--background:none;}}
text{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}
.cl-bg{fill:var(--background)}
.cl-ground{stroke:var(--ground)}
.cl-bub{fill:var(--bubble);stroke:var(--bubble-stroke)}
.cl-bubfill{fill:var(--bubble)}
.cl-txt{fill:var(--text)}
.cl-muted-fill{fill:var(--muted)}
.cl-decor-fill{fill:var(--decor)}

@keyframes cl-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes cl-look{0%{transform:translateX(0)}20%{transform:translateX(-.5px)}40%{transform:translateX(0)}60%{transform:translateX(.5px)}80%{transform:translateX(0)}}
@keyframes cl-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--hop))}}
@keyframes cl-squash{0%,100%{transform:scale(1.08,.9)}25%{transform:scale(1,1)}50%{transform:scale(.96,1.05)}}
@keyframes cl-bounce{0%,66%,76%,86%,100%{transform:translateY(0)}71%,81%{transform:translateY(var(--hop))}}
@keyframes cl-bsquash{0%,64%,90%,100%{transform:scale(1,1)}66%,76%,86%{transform:scale(1.12,.86)}71%,81%{transform:scale(.94,1.06)}}
@keyframes cl-legs{0%{transform:translateY(0)}50%{transform:translateY(-.6px)}}
@keyframes cl-wave{0%,24%,100%{transform:translateY(0)}4%,12%,20%{transform:translateY(-2px)}8%,16%{transform:translateY(-1px)}}
@keyframes cl-sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes cl-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.95)}}
@keyframes cl-z{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(12px,-26px)}}
@keyframes cl-shadow{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(.7);opacity:.15}}
@keyframes cl-spin{to{transform:rotate(360deg)}}
@keyframes cl-pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes cl-drift{0%,100%{transform:translateX(0)}50%{transform:translateX(28px)}}
@keyframes cl-twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes cl-steam{0%{opacity:0;transform:translateY(0)}30%{opacity:.8}100%{opacity:0;transform:translateY(-1.6px)}}
@keyframes cl-flowersway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes cl-cycle-4{0%{opacity:0}2%{opacity:1}23%{opacity:1}25%{opacity:0}100%{opacity:0}}@keyframes cl-type-4{0%{transform:scaleX(0)}11.25%{transform:scaleX(1)}100%{transform:scaleX(1)}}</style>
<defs><pattern id="cl-dither" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="1.5" height="1.5" class="cl-decor-fill"/></pattern><clipPath id="cl-clip-0"><rect x="127" y="35.5" width="239.7" height="22.5" style="animation:cl-type-4 12s steps(22) 0s infinite;transform-box:fill-box;transform-origin:0 50%"/></clipPath><clipPath id="cl-clip-1"><rect x="127" y="35.5" width="239.7" height="22.5" style="animation:cl-type-4 12s steps(22) 3s infinite;transform-box:fill-box;transform-origin:0 50%"/></clipPath><clipPath id="cl-clip-2"><rect x="127" y="35.5" width="260.4" height="22.5" style="animation:cl-type-4 12s steps(24) 6s infinite;transform-box:fill-box;transform-origin:0 50%"/></clipPath><clipPath id="cl-clip-3"><rect x="127" y="35.5" width="260.4" height="22.5" style="animation:cl-type-4 12s steps(24) 9s infinite;transform-box:fill-box;transform-origin:0 50%"/></clipPath></defs>
<g transform="translate(116.75 47.05)"><g style="animation:cl-spin 2.4s linear infinite,cl-pulse 1.2s ease-in-out infinite" stroke="#D97757" stroke-width="2.14" stroke-linecap="round"><line x1="0" y1="-6.3" x2="0" y2="6.3"/><line x1="-6.3" y1="0" x2="6.3" y2="0"/><line x1="-4.45" y1="-4.45" x2="4.45" y2="4.45"/><line x1="-4.45" y1="4.45" x2="4.45" y2="-4.45"/></g></g><g style="opacity:0;animation:cl-cycle-4 12s linear 0s infinite"><g clip-path="url(#cl-clip-0)"><text x="131" y="52" text-anchor="start" font-size="15" font-weight="700" fill="#D97757">Shipping XAF features…</text></g><text class="cl-muted-fill" x="338" y="52" font-size="12.75">(esc to interrupt)</text></g><g style="opacity:0;animation:cl-cycle-4 12s linear 3s infinite"><g clip-path="url(#cl-clip-1)"><text x="131" y="52" text-anchor="start" font-size="15" font-weight="700" fill="#D97757">Refactoring legacy C#…</text></g><text class="cl-muted-fill" x="338" y="52" font-size="12.75">(esc to interrupt)</text></g><g style="opacity:0;animation:cl-cycle-4 12s linear 6s infinite"><g clip-path="url(#cl-clip-2)"><text x="131" y="52" text-anchor="start" font-size="15" font-weight="700" fill="#D97757">Modeling business logic…</text></g><text class="cl-muted-fill" x="356" y="52" font-size="12.75">(esc to interrupt)</text></g><g style="opacity:0;animation:cl-cycle-4 12s linear 9s infinite"><g clip-path="url(#cl-clip-3)"><text x="131" y="52" text-anchor="start" font-size="15" font-weight="700" fill="#D97757">Taming DevExpress grids…</text></g><text class="cl-muted-fill" x="356" y="52" font-size="12.75">(esc to interrupt)</text></g>
<g transform="translate(17 30)"><g><g transform="scale(6)"><g fill="#D97757" shape-rendering="crispEdges"><rect x="1" y="7" width="1" height="1"/><rect x="3" y="7" width="1" height="1"/><rect x="7" y="7" width="1" height="1"/><rect x="9" y="7" width="1" height="1"/><rect x="1" y="1" width="9" height="6"/><rect x="0" y="3" width="1" height="2"/><rect x="10" y="3" width="1" height="2"/><g style="animation:cl-look 7s steps(1) 0s infinite;"><g style="animation:cl-blink 3.5s linear 0s infinite;transform-box:fill-box;transform-origin:50% 50%;"><rect x="2" y="3" width="1" height="1" fill="#141413"/><rect x="8" y="3" width="1" height="1" fill="#141413"/></g></g><rect x="2.5" y="4.4" width="6" height="3" fill="#3a3a3a"/><rect x="1.5" y="7.2" width="8" height="0.6" fill="#8b8b8b"/><g transform="translate(5.5 5.9)" stroke="#D97757" stroke-width=".3" stroke-linecap="round"><line x1="0" y1="-0.9" x2="0" y2="0.9"/><line x1="-0.9" y1="0" x2="0.9" y2="0"/><line x1="-0.64" y1="-0.64" x2="0.64" y2="0.64"/><line x1="-0.64" y1="0.64" x2="0.64" y2="-0.64"/></g><rect x="11" y="3.6" width="2" height="2.2" fill="#f5f0e8"/><rect x="13" y="4" width="0.6" height="1.2" fill="#f5f0e8"/><rect x="11" y="3.6" width="2" height="0.45" fill="#6f4e37"/><g style="animation:cl-steam 2.4s ease-out 0s infinite;"><rect x="11.3" y="2.4" width="0.45" height="0.8" fill="#c8c1b6"/></g><g style="animation:cl-steam 2.4s ease-out 1.2s infinite;"><rect x="12.2" y="2.4" width="0.45" height="0.8" fill="#c8c1b6"/></g></g></g></g></g>
</svg>
