<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180" role="img" aria-label="Clawd, the Claude Code mascot">
<style>:root{--ground:#3d3929;--text:#1f2328;--muted:#656d76;--bubble:#ffffff;--bubble-stroke:#d0d7de;--decor:#3d3929;--background:#fdf6ec;}@media (prefers-color-scheme: dark){:root{--ground:#8b949e;--text:#e6edf3;--muted:#8b949e;--bubble:#161b22;--bubble-stroke:#30363d;--decor:#8b949e;--background:#1a1a17;}}
text{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace}
.cl-bg{fill:var(--background)}
.cl-ground{stroke:var(--ground)}
.cl-bub{fill:var(--bubble);stroke:var(--bubble-stroke)}
.cl-bubfill{fill:var(--bubble)}
.cl-txt{fill:var(--text)}
.cl-muted-fill{fill:var(--muted)}
.cl-decor-fill{fill:var(--decor)}

@keyframes cl-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes cl-look{0%{transform:translateX(0)}20%{transform:translateX(-.5px)}40%{transform:translateX(0)}60%{transform:translateX(.5px)}80%{transform:translateX(0)}}
@keyframes cl-hop{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--hop))}}
@keyframes cl-squash{0%,100%{transform:scale(1.08,.9)}25%{transform:scale(1,1)}50%{transform:scale(.96,1.05)}}
@keyframes cl-bounce{0%,66%,76%,86%,100%{transform:translateY(0)}71%,81%{transform:translateY(var(--hop))}}
@keyframes cl-bsquash{0%,64%,90%,100%{transform:scale(1,1)}66%,76%,86%{transform:scale(1.12,.86)}71%,81%{transform:scale(.94,1.06)}}
@keyframes cl-legs{0%{transform:translateY(0)}50%{transform:translateY(-.6px)}}
@keyframes cl-wave{0%,24%,100%{transform:translateY(0)}4%,12%,20%{transform:translateY(-2px)}8%,16%{transform:translateY(-1px)}}
@keyframes cl-sway{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
@keyframes cl-breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.03,.95)}}
@keyframes cl-z{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(12px,-26px)}}
@keyframes cl-shadow{0%,100%{transform:scale(1);opacity:.3}50%{transform:scale(.7);opacity:.15}}
@keyframes cl-spin{to{transform:rotate(360deg)}}
@keyframes cl-pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes cl-drift{0%,100%{transform:translateX(0)}50%{transform:translateX(28px)}}
@keyframes cl-twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1)}}
@keyframes cl-steam{0%{opacity:0;transform:translateY(0)}30%{opacity:.8}100%{opacity:0;transform:translateY(-1.6px)}}
@keyframes cl-flowersway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes cl-cycle-3{0%{opacity:0}2%{opacity:1}31.33%{opacity:1}33.33%{opacity:0}100%{opacity:0}}@keyframes cl-type-3{0%{transform:scaleX(0)}15%{transform:scaleX(1)}100%{transform:scaleX(1)}}
@keyframes cl-w0-show{0%,14.08%{opacity:0}15.08%,27.08%{opacity:1}28.08%,100%{opacity:0}}@keyframes cl-w0-spark{0%,18.63%{opacity:0;transform:scale(.2) rotate(0deg)}21.08%{opacity:1;transform:scale(1.2) rotate(45deg)}23.53%{opacity:1;transform:scale(1) rotate(90deg)}28.08%,100%{opacity:0;transform:scale(.4) rotate(120deg)}}
@keyframes cl-w0-trick{0%,18.63%,23.53%,100%{transform:translateY(0)}21.08%{transform:translateY(-56px)}}
@keyframes cl-w0{0%{transform:translateX(-97px)}14.08%,28.08%{transform:translateX(69.5px)}100%{transform:translateX(920px)}}</style>
<defs><pattern id="cl-dither" width="3" height="3" patternUnits="userSpaceOnUse"><rect width="1.5" height="1.5" class="cl-decor-fill"/></pattern><clipPath id="cl-clip-0"><rect x="309.19" y="97.3" width="375.63" height="25.5" style="animation:cl-type-3 10.5s steps(31) 0s infinite;transform-box:fill-box;transform-origin:0 50%"/></clipPath><clipPath id="cl-clip-1"><rect x="361.97" y="97.3" width="270.06" height="25.5" style="animation:cl-type-3 10.5s steps(22) 3.5s infinite;transform-box:fill-box;transform-origin:0 50%"/></clipPath><clipPath id="cl-clip-2"><rect x="338.51" y="97.3" width="316.98" height="25.5" style="animation:cl-type-3 10.5s steps(26) 7s infinite;transform-box:fill-box;transform-origin:0 50%"/></clipPath></defs>
<rect class="cl-bg" width="900" height="180" rx="14"/>
<line class="cl-ground" x1="3" y1="165.5" x2="897" y2="165.5" stroke-width="3" stroke-linecap="round" stroke-dasharray="0 7.8"/>
<g transform="translate(300 20)"><g style="animation:cl-drift 12s ease-in-out infinite" fill="url(#cl-dither)" shape-rendering="crispEdges"><rect x="30" y="0" width="48" height="12"/><rect x="0" y="12" width="120" height="18"/></g></g>
<g transform="translate(666 34)"><g style="animation:cl-drift 17.14s ease-in-out infinite" fill="url(#cl-dither)" shape-rendering="crispEdges"><rect x="18" y="0" width="28.8" height="7.2"/><rect x="0" y="7.2" width="72" height="10.8"/></g></g>
<g transform="translate(705 104)"><g style="animation:cl-flowersway 4s ease-in-out 0s infinite;transform-box:fill-box;transform-origin:50% 100%" shape-rendering="crispEdges"><rect x="12.5" y="30" width="5" height="7.5" fill="url(#cl-dither)"/><rect x="15" y="37.5" width="5" height="7.5" fill="url(#cl-dither)"/><rect x="12.5" y="45" width="5" height="7.5" fill="url(#cl-dither)"/><rect x="10" y="52.5" width="5" height="7.5" fill="url(#cl-dither)"/><rect x="10" y="0" width="10" height="10" fill="url(#cl-dither)"/><rect x="0" y="10" width="10" height="10" fill="url(#cl-dither)"/><rect x="20" y="10" width="10" height="10" fill="url(#cl-dither)"/><rect x="10" y="20" width="10" height="10" fill="url(#cl-dither)"/><rect x="10" y="10" width="10" height="10" class="cl-decor-fill"/></g></g>
<g transform="translate(790.5 86)"><g style="animation:cl-flowersway 4s ease-in-out 1s infinite;transform-box:fill-box;transform-origin:50% 100%" shape-rendering="crispEdges"><rect x="16.25" y="39" width="6.5" height="9.75" fill="url(#cl-dither)"/><rect x="19.5" y="48.75" width="6.5" height="9.75" fill="url(#cl-dither)"/><rect x="16.25" y="58.5" width="6.5" height="9.75" fill="url(#cl-dither)"/><rect x="13" y="68.25" width="6.5" height="9.75" fill="url(#cl-dither)"/><rect x="13" y="0" width="13" height="13" fill="url(#cl-dither)"/><rect x="0" y="13" width="13" height="13" fill="url(#cl-dither)"/><rect x="26" y="13" width="13" height="13" fill="url(#cl-dither)"/><rect x="13" y="26" width="13" height="13" fill="url(#cl-dither)"/><rect x="13" y="13" width="13" height="13" class="cl-decor-fill"/></g></g>
<g transform="translate(252 34)"><g style="animation:cl-twinkle 2.4s ease-in-out 0.4s infinite;transform-box:fill-box;transform-origin:50% 50%" stroke="#D97757" stroke-width="2.5" stroke-linecap="round"><line x1="0" y1="-7" x2="0" y2="7"/><line x1="-7" y1="0" x2="7" y2="0"/><line x1="-4.95" y1="-4.95" x2="4.95" y2="4.95"/><line x1="-4.95" y1="4.95" x2="4.95" y2="-4.95"/></g></g>
<g transform="translate(846 24)"><g style="animation:cl-twinkle 2.4s ease-in-out 1.3s infinite;transform-box:fill-box;transform-origin:50% 50%" stroke="#D97757" stroke-width="1.75" stroke-linecap="round"><line x1="0" y1="-4.8999999999999995" x2="0" y2="4.8999999999999995"/><line x1="-4.8999999999999995" y1="0" x2="4.8999999999999995" y2="0"/><line x1="-3.46" y1="-3.46" x2="3.46" y2="3.46"/><line x1="-3.46" y1="3.46" x2="3.46" y2="-3.46"/></g></g>
<text x="495" y="82" text-anchor="middle" font-size="30" font-weight="700" fill="var(--text)">Hi, I'm Jamey</text>
<g style="opacity:0;animation:cl-cycle-3 10.5s linear 0s infinite"><g clip-path="url(#cl-clip-0)"><text x="495" y="116" text-anchor="middle" font-size="17" font-weight="600" fill="var(--muted)">Software Developer from Germany</text></g></g><g style="opacity:0;animation:cl-cycle-3 10.5s linear 3.5s infinite"><g clip-path="url(#cl-clip-1)"><text x="495" y="116" text-anchor="middle" font-size="17" font-weight="600" fill="var(--muted)">C# · Java · TypeScript</text></g></g><g style="opacity:0;animation:cl-cycle-3 10.5s linear 7s infinite"><g clip-path="url(#cl-clip-2)"><text x="495" y="116" text-anchor="middle" font-size="17" font-weight="600" fill="var(--muted)">powered by coffee &amp; Claude</text></g></g>
<g transform="translate(0 108)"><g style="animation:cl-w0 18s linear 0s infinite;transform:translateX(-97px)"><ellipse cx="38.5" cy="57.5" rx="34.65" ry="4.2" fill="#000" opacity=".3" style="animation:cl-shadow 0.5s ease-in-out 0s infinite;transform-box:fill-box;transform-origin:50% 50%;"/><g style="animation:cl-w0-trick 18s ease-in-out 0s infinite;transform-box:fill-box;transform-origin:50% 50%"><g style="animation:cl-hop 0.5s ease-in-out 0s infinite;--hop:-9px;"><g style="animation:cl-squash 0.5s ease-in-out 0s infinite;transform-box:fill-box;transform-origin:50% 100%;"><g transform="scale(7)"><g fill="#D97757" shape-rendering="crispEdges"><g style="animation:cl-legs 0.5s steps(1) 0s infinite;"><rect x="1" y="6" width="1" height="2"/><rect x="7" y="6" width="1" height="2"/></g><g style="animation:cl-legs 0.5s steps(1) -0.25s infinite;"><rect x="3" y="6" width="1" height="2"/><rect x="9" y="6" width="1" height="2"/></g><rect x="1" y="0" width="9" height="6"/><rect x="0" y="2" width="1" height="2"/><rect x="10" y="2" width="1" height="2"/><g style="animation:cl-blink 3.5s linear 0s infinite;transform-box:fill-box;transform-origin:50% 50%;"><rect x="2" y="2" width="1" height="1" fill="#141413"/><rect x="8" y="2" width="1" height="1" fill="#141413"/></g></g></g></g></g></g><g style="opacity:0;animation:cl-w0-show 18s linear 0s infinite"><g><rect class="cl-bub" x="53.9" y="-42" width="72.4" height="30" rx="8" stroke-width="2"/><path class="cl-bub" d="M63.9 -13 L57.9 -2 L75.9 -13 Z" stroke-width="2" stroke-linejoin="round"/><rect class="cl-bubfill" x="64.9" y="-15" width="10" height="4"/><text class="cl-txt" x="90.1" y="-21.96" text-anchor="middle" font-size="14" font-weight="700">hallo!</text></g></g><g style="opacity:0;animation:cl-w0-spark 18s linear 0s infinite;transform-box:fill-box;transform-origin:50% 50%"><g transform="translate(-7 7)" stroke="#D97757" stroke-width="4" stroke-linecap="round"><line x1="0" y1="-10" x2="0" y2="10"/><line x1="-10" y1="0" x2="10" y2="0"/><line x1="-7.07" y1="-7.07" x2="7.07" y2="7.07"/><line x1="-7.07" y1="7.07" x2="7.07" y2="-7.07"/></g></g></g></g>
</svg>
