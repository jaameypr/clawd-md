<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120" role="img" aria-label="Clawd, the Claude Code mascot, hopping across the page">
  <style>
    :root { --ground: #d0d7de; --bubble: #ffffff; --bubble-stroke: #d0d7de; --text: #1f2328; }
    @media (prefers-color-scheme: dark) {
      :root { --ground: #30363d; --bubble: #161b22; --bubble-stroke: #30363d; --text: #e6edf3; }
    }
    .ground { stroke: var(--ground); }
    .bubble { fill: var(--bubble); stroke: var(--bubble-stroke); }
    .bubble-fill { fill: var(--bubble); }
    .bubble-text { fill: var(--text); font: 700 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    /* walks in, stops in the middle, does a flip, walks out */
    .walker   { animation: walk 14s linear infinite; }
    .bigjump  { animation: flip 14s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    .hop      { animation: hop .5s ease-in-out infinite; }
    .squash   { animation: squash .5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .shadow   { animation: shadow .5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    .legA     { animation: legs .5s steps(1) infinite; }
    .legB     { animation: legs .5s steps(1) infinite; animation-delay: -.25s; }
    .eyes     { animation: blink 3.5s infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    .say      { animation: say 14s infinite; opacity: 0; }
    .spark    { animation: spark 14s infinite; transform-box: fill-box; transform-origin: 50% 50%; opacity: 0; }

    @keyframes walk {
      0%   { transform: translateX(-90px); }
      44%  { transform: translateX(414px); }
      56%  { transform: translateX(414px); }
      100% { transform: translateX(990px); }
    }
    @keyframes flip {
      0%, 47%   { transform: translateY(0) rotate(0deg); }
      50%       { transform: translateY(-48px) rotate(180deg); }
      53%, 100% { transform: translateY(0) rotate(360deg); }
    }
    @keyframes hop {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-9px); }
    }
    @keyframes squash {
      0%, 100% { transform: scale(1.08, .9); }
      25%      { transform: scale(1, 1); }
      50%      { transform: scale(.96, 1.05); }
    }
    @keyframes shadow {
      0%, 100% { transform: scale(1); opacity: .35; }
      50%      { transform: scale(.7); opacity: .18; }
    }
    @keyframes legs {
      0%  { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      93%           { transform: scaleY(.1); }
    }
    @keyframes say {
      0%, 44%   { opacity: 0; }
      45%, 55%  { opacity: 1; }
      56%, 100% { opacity: 0; }
    }
    @keyframes spark {
      0%, 49%   { opacity: 0; transform: scale(.2) rotate(0deg); }
      51%       { opacity: 1; transform: scale(1.2) rotate(45deg); }
      55%       { opacity: 1; transform: scale(1) rotate(90deg); }
      58%, 100% { opacity: 0; transform: scale(.4) rotate(120deg); }
    }
  </style>

  <line class="ground" x1="0" y1="100.5" x2="900" y2="100.5" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>

  <g class="walker">
    <ellipse class="shadow" cx="36" cy="102" rx="34" ry="4" fill="#000"/>

    <!-- speech bubble -->
    <g class="say">
      <rect class="bubble" x="58" y="10" width="54" height="30" rx="8" stroke-width="2"/>
      <path class="bubble" d="M66 39 L60 50 L76 39 Z" stroke-width="2" stroke-linejoin="round"/>
      <rect class="bubble-fill" x="62" y="37" width="16" height="4"/>
      <text class="bubble-text" x="85" y="30" text-anchor="middle">hi!</text>
    </g>

    <!-- Claude sparkle -->
    <g class="spark">
      <g stroke="#D97757" stroke-width="4" stroke-linecap="round">
        <line x1="8" y1="18" x2="8" y2="38"/>
        <line x1="-2" y1="28" x2="18" y2="28"/>
        <line x1="0.9" y1="20.9" x2="15.1" y2="35.1"/>
        <line x1="0.9" y1="35.1" x2="15.1" y2="20.9"/>
      </g>
    </g>

    <g class="bigjump">
      <g class="hop">
        <g class="squash">
          <!-- Clawd, drawn on a 6px pixel grid -->
          <g transform="translate(0 58)" fill="#D97757" shape-rendering="crispEdges">
            <g class="legA">
              <rect x="12" y="30" width="6" height="12"/>
              <rect x="42" y="30" width="6" height="12"/>
            </g>
            <g class="legB">
              <rect x="24" y="30" width="6" height="12"/>
              <rect x="54" y="30" width="6" height="12"/>
            </g>
            <rect x="6" y="0" width="60" height="30"/>
            <rect x="0" y="12" width="6" height="12"/>
            <rect x="66" y="12" width="6" height="12"/>
            <g class="eyes" fill="#141413">
              <rect x="18" y="6" width="6" height="12"/>
              <rect x="48" y="6" width="6" height="12"/>
            </g>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>
